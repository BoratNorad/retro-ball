# Render Blueprint (free tier). New → Blueprint → pick this repo.
# Two services: the static browser client and the online game server (WebSocket on /ws).
# The free web service sleeps when idle, so the first online connection can take ~30 s.
services:
  - type: web
    name: tdf-server
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @tdf/server start
    healthCheckPath: /health
    # Accounts, ratings and leaderboards live in SQLite at $DATA_DIR/tdf.sqlite. Free web services have
    # no persistent disk (the file is lost on every deploy/restart); on a paid plan uncomment the disk.
    envVars:
      - key: DATA_DIR
        value: /var/data
    # disk:
    #   name: tdf-data
    #   mountPath: /var/data
    #   sizeGB: 1
    pullRequestPreviewsEnabled: false
  - type: web
    name: triple-draft-football
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: apps/client/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SERVER_HOST
        fromService:
          type: web
          name: tdf-server
          property: host
    headers:
      - path: /game-data/*
        name: Cache-Control
        value: public, max-age=3600
