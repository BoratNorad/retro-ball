# Render Blueprint (free tier). New → Blueprint → pick this repo.
# Two services: the static browser client and the online game server (WebSocket on /ws).
# The free web service sleeps when idle, so the first online connection can take ~30 s.
services:
  - type: web
    name: tdf-server
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @tdf/server start
    healthCheckPath: /health
    # Accounts, ratings and leaderboards live in SQLite at $DATA_DIR/tdf.sqlite (default ./data). Free web
    # services have no persistent disk (the file is lost on every deploy/restart); on a paid plan add
    # DATA_DIR=/var/data and uncomment the disk.
    envVars:
      - key: NODE_VERSION
        value: "22"
    # disk:
    #   name: tdf-data
    #   mountPath: /var/data
    #   sizeGB: 1
    pullRequestPreviewsEnabled: false
  - type: web
    name: triple-draft-football
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: apps/client/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The game server's PUBLIC address, e.g. wss://tdf-server.onrender.com/ws (Render asks for it when
      # the Blueprint is created; copy the server's .onrender.com URL). fromService only gives the
      # private-network host name, which a browser cannot reach.
      - key: VITE_SERVER_URL
        sync: false
    headers:
      - path: /game-data/*
        name: Cache-Control
        value: public, max-age=3600
