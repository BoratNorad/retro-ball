name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dataset balance report (fails if any draft slot is short on options)
        run: pnpm data:report
      - name: pool.json must be committed up to date
        run: git diff --exit-code packages/shared/data/pool.json
